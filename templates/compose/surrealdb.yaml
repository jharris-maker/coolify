# documentation: https://surrealdb.com/docs/surrealdb/installation/running/docker
# slogan: SurrealDB multi-model database backed by persistent RocksDB storage.
# category: database
# tags: surrealdb, database, rocksdb, nosql, graph, vector, realtime
# logo: svgs/surrealdb.svg
# port: 8000

services:
  surrealdb:
    image: surrealdb/surrealdb:v2.1.4
    command:
      - start
      - --log
      - info
      - --user
      - ${SERVICE_USER_SURREAL}
      - --pass
      - ${SERVICE_PASSWORD_SURREAL}
      - --bind
      - 0.0.0.0:8000
      - rocksdb:/data/srdb.db
    volumes:
      - surrealdb-data:/data
    environment:
      - SERVICE_URL_SURREALDB_8000
      - SURREAL_USER=${SERVICE_USER_SURREAL}
      - SURREAL_PASS=${SERVICE_PASSWORD_SURREAL}
    healthcheck:
      test:
        - CMD
        - /surreal
        - is-ready
        - --conn
        - http://127.0.0.1:8000
      interval: 10s
      timeout: 5s
      retries: 5
